<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="/Base/Css/base.css">
    <link rel="stylesheet" href="/Base/Css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</head>
<body>
    <div class="wrapper_cart">
        <div class="cart_heaader">
            <div class="container d-flex align-items-center justify-content-between">
                <div class="cart_hearder_left d-flex align-items-end">
                    <img src="/Image/logo.png" alt="">
                    <span class="fs-5">Giỏ Hàng</span>
                </div>
                <div class="cart_search">
                    <input type="text" placeholder="Nhập tên sản phẩm muốn tìm kiếm...">
                    <input type="button" value="search">
                </div>
            </div>
        </div>
        <ul class="hearder_ul_cart container fs-3">               
                    <li class="col-1">
                        <input type="checkbox" class="checkall">
                    </li>
                    <li class='col-3'>
                        Sản Phẩm
                    </li>
                    <li class="col-2">
                        Đơn giá
                    </li>
                    <li class='col-2'>
                        Số Lượng
                    </li>
                    <li class='col-2'>
                        Số Tiền
                    </li>
                    <li class='col-1'>
                        Thao Tác
                    </li>              
        </ul>
        <div class="list_cart d-flex flex-column container"></div>
        <div class="container bottom_cart d-flex justify-content-between align-items-center">
            <span class="deleteAll text-white fs-4">Xóa Tất Cả</span>
            <div >
                <span class="sum text-white fs-4 me-4"></span>
                <button class="btn btn-danger fs-4 button">Thanh Toán</button>
            </div>
        </div>
    </div>
    <script src="/Base/JS/cart.js"></script>
</body>
</html>
