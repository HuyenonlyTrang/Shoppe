<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng kí</title>
    <link rel="stylesheet" href="/Base/Css/base.css">
    <link rel="stylesheet" href="/Base/Css/main.css">
    <link rel="stylesheet" href="/Base/Css/admin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

</head>
<body>
    <div style="background-color: #ff834a; padding:10px 0;">
      <div class="container"> 
        <img src="/Image/logo.png" alt="" class="w-25">
        <h1 class="text_register" style="text-shadow: 0 0 2px #333"></h1>
        <div class="d-flex flex-column gap-5 align-items-center">
             <input type="text" class="name" placeholder="Họ Và Tên" style="width: 50%">
             <input type="number" class="sdt" placeholder="Số điện thoại" style="width: 50%">
             <input type="email" class="email" placeholder="Gmail" style="width: 50%">
             <input type="number" class="birth_year" placeholder="Năm Sinh" style="width: 50%">
             <input type="password" class="password" placeholder="password" style="width: 50%">
             <input type="submit" id="submit"> 
        </div>
      </div>
    </div>
    <script>
        const text = document.querySelector('.text_register')
        const submit = document.querySelector('#submit');

        const newText = 'Chào Mừng Bạn Đến Với Trang Đăng Kí'.split('')
        const delay = (ms) => {
            return new Promise(resolve => setTimeout(resolve,ms))
        }
        async function running(){
             while(true){
                text.textContent = ''
                for(var i = 0; i < newText.length; i++){
                text.textContent += newText[i];
                await delay(300)
                }
             await delay(1000)
            }
        }
        running()

        submit.addEventListener('click', () => {
             const name = document.querySelector('.name').value;
             const phone = document.querySelector('.sdt').value;
             const email = document.querySelector('.email').value;
             const birth_year = document.querySelector('.birth_year').value;
             const password = document.querySelector('.password').value;
             console.log(name)
             if(!name || !phone || !email || !birth_year || !password){
                alert('Bạn chưa nhập đầy đủ')
                return ;
             }
             fetch('http://localhost:3001/add-user', {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, phone, email, birth_year, password })
              })
            .then(res => res.json())
            .then(data => {
                alert('Bạn Đã Đăng Kí Thành Công Tài Khoản !!!')
            })
            .catch(err => {
                console.log(err)
            })
        })


    </script>
</body>
</html>
