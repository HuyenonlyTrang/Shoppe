<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login In</title>
    <link rel="stylesheet" href="/Base/Css/base.css">
    <link rel="stylesheet" href="/Base/Css/main.css">
    <link rel="stylesheet" href="/Base/Css/admin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</head>
<body>
    <div style="background-color: #ff834a; padding-top: 10px;">
        <div class="container">
          <img src="/Image/logo.png" alt="" class="w-25 h-25">
          <h1 style="text-shadow: 0 0 2px #333" class="text-login"></h1>
          <div class="d-flex justify-content-center flex-column align-items-center gap-5" style="padding: 50px 0">
               <input type="text" placeholder="Name" class="name" style="width: 50%"/>
               <input type="password" placeholder="password" class="password" style="width: 50%">
               <input type="submit" id="submit"> 
          </div>
        </div>
    </div>
    <script>
         const name = document.querySelector('.name')
         const password = document.querySelector('.password')
         const submit = document.querySelector('#submit')
         submit.addEventListener('click', () => {
            const n = document.querySelector('.name').value;
            const p = document.querySelector('.password').value;
            fetch('http://localhost:3001/users')
                .then(res => res.json())
                .then(data => {
                    const user = data.find(item => item.name.trim() === n && item.password.trim() === p);
                    if (user && user.name !== 'Admin') {
                        localStorage.setItem('currentUser', JSON.stringify(user)); 
                        setTimeout(() => {
                            window.location.href = 'index.html'; 
                        },2000)
                    }else if(user && user.name === 'Admin'){
                        localStorage.setItem('currentUser', JSON.stringify(user)); 
                        setTimeout(() => {
                            window.location.href = './Admin/admin.html'; 
                        },2000)
                    }else {
                        console.log('❌ Không tìm thấy người dùng phù hợp');
                    }

                })
                .catch(error => {
                    console.error('Lỗi khi gọi API:', error);
                });
         })
        const text = document.querySelector('.text-login')
        const newText = 'Chào Mừng Đến Trang Login'.split('')

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        const func = async () => {
            while(true){
                text.textContent = ''
                for(var i = 0; i < newText.length ; i++){
                    text.textContent += newText[i]
                    await delay(200)
                }
                await delay(1000)
            }
        }
        func()
    </script>
</body>
</html>
